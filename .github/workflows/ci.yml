name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  VITE_DEFAULT_EXCEL_ID: ${{ vars.VITE_DEFAULT_EXCEL_ID }}
  ROOT_BASE_URL: ${{ vars.ROOT_BASE_URL }}
  COMMIT_ID: ${{ github.sha }}

jobs:
  check:
    name: Check & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type check
        run: yarn type-check

      - name: Check dependencies
        run: yarn check:dependencies

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn format

      - name: Unit test
        run: yarn coverage

      - name: Upload coverage
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
          - { project: ipad-pro, browser: webkit }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}

      - name: E2E tests
        run: yarn e2e --project=${{ matrix.project }}
        env:
          CI: true
          TEST_ENV: local

      - name: Upload Playwright test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  build:
    name: Build & deploy
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: yarn build

      - name: Deploy to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/demo/frontend/dist

      - name: Verify deployment
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "Checking if site is accessible..."
          commit_id="${{ github.sha }}"
          max_retries=5
          retry_interval=5
          for i in $(seq 1 $max_retries); do
            echo "Attempt $i/$max_retries: Waiting ${retry_interval}s for deployment to propagate..."
            sleep $retry_interval
            response=$(curl -sL https://nusr.github.io/excel)
            if echo "$response" | grep -q "$commit_id"; then
              echo "✓ COMMIT_ID ($commit_id) successfully injected into HTML"
              echo "✓ Deployment successful!"
              exit 0
            fi
            echo "Commit ID ($commit_id) not found yet, retrying..."
          done
          echo "✗ COMMIT_ID ($commit_id) verification failed after $max_retries attempts - commit ID not found in HTML!"
          exit 1

  prod-e2e:
    name: Production E2E (${{ matrix.project }})
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
          - { project: ipad-pro, browser: webkit }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}

      - name: Production E2E tests
        run: yarn e2e --project=${{ matrix.project }}
        env:
          CI: true
          TEST_ENV: production

      - name: Upload Prod Playwright test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-prod-e2e-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
